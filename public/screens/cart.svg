  <line x1="267" y1="722" x2="289" y2="722" stroke="#3DBE8B" stroke-width="2" stroke-linecap="round"/>
  <line x1="267" y1="730" x2="289" y2="730" stroke="#3DBE8B" stroke-width="2" stroke-linecap="round"/>
  <line x1="267" y1="738" x2="289" y2="738" stroke="#3DBE8B" stroke-width="2" stroke-linecap="round"/>
  <text x="278" y="767" font-size="10" fill="#3DBE8B" font-weight="700" text-anchor="middle">Feed</text>

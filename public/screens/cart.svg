  <text x="65" y="598" font-size="13" fill="#6B7280" text-anchor="middle">🤍  Like</text>
  <text x="195" y="598" font-size="13" fill="#6B7280" text-anchor="middle">💬  Comment</text>
  <text x="320" y="598" font-size="13" fill="#6B7280" text-anchor="middle">↗  Share</text>


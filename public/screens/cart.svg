<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2faf7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="90" y="40" width="720" height="1520" rx="84" fill="#0b1220"/>
  <rect x="115" y="70" width="670" height="1460" rx="72" fill="url(#bg)"/>
  <rect x="320" y="92" width="260" height="56" rx="28" fill="#0b1220" opacity="0.92"/>

  <!-- Top bar -->
  <text x="170" y="220" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="44" font-weight="900" fill="#0b1220">Cart</text>
  <circle cx="725" cy="210" r="22" fill="url(#accent)" filter="url(#shadow)"/>

  <!-- Cart list cards -->
  <g>
    <rect x="145" y="290" width="640" height="180" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="165" y="310" width="140" height="140" rx="18" fill="#f8fafc"/>
    <rect x="325" y="330" width="300" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="325" y="360" width="240" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="325" y="392" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="675" y="336" width="90" height="34" rx="17" fill="#eaf4f0" stroke="#10b981" stroke-width="3"/>
    <rect x="682" y="344" width="46" height="10" rx="5" fill="#10b981" opacity="0.9"/>
  </g>

  <g>
    <rect x="145" y="500" width="640" height="180" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="165" y="520" width="140" height="140" rx="18" fill="#f8fafc"/>
    <rect x="325" y="540" width="320" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="325" y="570" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="325" y="602" width="200" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="675" y="546" width="90" height="34" rx="17" fill="#eaf4f0" stroke="#10b981" stroke-width="3"/>
    <rect x="682" y="554" width="46" height="10" rx="5" fill="#10b981" opacity="0.9"/>
  </g>

  <g>
    <rect x="145" y="710" width="640" height="180" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="165" y="730" width="140" height="140" rx="18" fill="#f8fafc"/>
    <rect x="325" y="750" width="280" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="325" y="780" width="250" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="325" y="812" width="210" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="675" y="756" width="90" height="34" rx="17" fill="#eaf4f0" stroke="#10b981" stroke-width="3"/>
    <rect x="682" y="764" width="46" height="10" rx="5" fill="#10b981" opacity="0.9"/>
  </g>

  <!-- Summary -->
  <rect x="145" y="950" width="640" height="240" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="180" y="1010" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="28" font-weight="900" fill="#0b1220">Summary</text>
  <rect x="180" y="1040" width="380" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="180" y="1070" width="420" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="180" y="1100" width="300" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="180" y="1150" width="560" height="64" rx="22" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="460" y="1192" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="900" fill="#ffffff">Request pickup</text>

  <!-- Bottom nav -->
  <rect x="115" y="1452" width="670" height="78" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <g fill="#94a3b8" opacity="0.9">
    <rect x="175" y="1476" width="34" height="34" rx="8"/>
    <rect x="315" y="1476" width="34" height="34" rx="8"/>
  </g>
  <g fill="#10b981" opacity="0.9">
    <rect x="455" y="1476" width="34" height="34" rx="8"/>
  </g>
  <g fill="#94a3b8" opacity="0.9">
    <rect x="595" y="1476" width="34" height="34" rx="8"/>
    <rect x="705" y="1476" width="34" height="34" rx="8"/>
  </g>
</svg>

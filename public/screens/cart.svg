  <path d="M183 720 Q183 718 185 718 L211 718 Q213 718 213 720 L213 734 Q213 736 211 736 L198 736 L192 742 L192 736 L185 736 Q183 736 183 734 Z" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>

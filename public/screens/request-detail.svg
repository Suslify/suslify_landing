  <!-- Gift icon -->
  <rect x="53" y="568" width="22" height="16" rx="2" fill="none" stroke="white" stroke-width="1.7"/>
  <line x1="53" y1="575" x2="75" y2="575" stroke="white" stroke-width="1.7"/>
  <line x1="64" y1="568" x2="64" y2="584" stroke="white" stroke-width="1.7"/>
  <!-- Bow left -->

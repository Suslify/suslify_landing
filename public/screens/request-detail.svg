  <path d="M340 745 Q340 737 351 737 Q362 737 362 745" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
  <text x="351" y="766" font-size="10" fill="#9CA3AF" text-anchor="middle">Profile</text>


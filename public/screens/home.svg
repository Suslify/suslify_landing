<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2faf7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="90" y="40" width="720" height="1520" rx="84" fill="#0b1220"/>
  <rect x="115" y="70" width="670" height="1460" rx="72" fill="url(#bg)"/>
  <rect x="320" y="92" width="260" height="56" rx="28" fill="#0b1220" opacity="0.92"/>

  <!-- Header -->
  <circle cx="175" cy="210" r="40" fill="#e5e7eb"/>
  <text x="245" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="44" font-weight="800" fill="#0b1220">Welcome!</text>
  <text x="245" y="258" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="700" fill="#5b667a">Home</text>
  <circle cx="720" cy="225" r="18" fill="#5b667a" opacity="0.35"/>

  <!-- Search -->
  <rect x="145" y="320" width="520" height="92" rx="22" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <circle cx="185" cy="366" r="16" fill="#10b981" opacity="0.9"/>
  <rect x="218" y="350" width="220" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="218" y="372" width="150" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="690" y="316" width="96" height="96" rx="26" fill="url(#accent)" filter="url(#shadow)"/>
  <rect x="715" y="348" width="46" height="10" rx="5" fill="#ffffff" opacity="0.92"/>
  <rect x="715" y="372" width="30" height="10" rx="5" fill="#ffffff" opacity="0.92"/>

  <!-- Categories row -->
  <text x="145" y="510" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="30" font-weight="800" fill="#0b1220">Categories</text>
  <g opacity="0.98">
    <circle cx="210" cy="600" r="58" fill="#10b981"/>
    <circle cx="360" cy="600" r="58" fill="#10b981" opacity="0.92"/>
    <circle cx="510" cy="600" r="58" fill="#10b981" opacity="0.86"/>
    <circle cx="660" cy="600" r="58" fill="#10b981" opacity="0.80"/>
  </g>
  <g fill="#5b667a" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="22" font-weight="700">
    <text x="176" y="700">Health</text>
    <text x="322" y="700">Toiletries</text>
    <text x="480" y="700">Clothing</text>
    <text x="628" y="700">Children</text>
  </g>

  <!-- Coming soon card -->
  <rect x="145" y="770" width="640" height="260" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="165" y="790" width="600" height="220" rx="22" fill="#f2faf7"/>
  <text x="450" y="915" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="34" font-weight="800" fill="#94a3b8">Coming soon…</text>

  <!-- Donations list -->
  <text x="145" y="1120" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="30" font-weight="800" fill="#0b1220">Donations</text>
  <text x="785" y="1120" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="800" fill="#10b981">See all</text>

  <rect x="145" y="1170" width="305" height="320" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="165" y="1190" width="265" height="220" rx="22" fill="#f8fafc"/>
  <rect x="165" y="1426" width="160" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="165" y="1456" width="120" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="480" y="1170" width="305" height="320" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="500" y="1190" width="265" height="220" rx="22" fill="#f8fafc"/>
  <rect x="500" y="1426" width="160" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="500" y="1456" width="120" height="12" rx="6" fill="#e2e8f0"/>

  <!-- Bottom nav -->
  <rect x="115" y="1452" width="670" height="78" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <g fill="#10b981" opacity="0.9">
    <rect x="175" y="1476" width="34" height="34" rx="8"/>
  </g>
  <g fill="#94a3b8" opacity="0.9">
    <rect x="315" y="1476" width="34" height="34" rx="8"/>
    <rect x="455" y="1476" width="34" height="34" rx="8"/>
    <rect x="595" y="1476" width="34" height="34" rx="8"/>
    <rect x="705" y="1476" width="34" height="34" rx="8"/>
  </g>
</svg>

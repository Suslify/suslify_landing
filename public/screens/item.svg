<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2faf7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="90" y="40" width="720" height="1520" rx="84" fill="#0b1220"/>
  <rect x="115" y="70" width="670" height="1460" rx="72" fill="url(#bg)"/>
  <rect x="320" y="92" width="260" height="56" rx="28" fill="#0b1220" opacity="0.92"/>

  <!-- Header -->
  <circle cx="170" cy="210" r="22" fill="#94a3b8" opacity="0.5"/>
  <text x="215" y="220" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="38" font-weight="900" fill="#0b1220">Item details</text>
  <rect x="700" y="192" width="72" height="44" rx="22" fill="#eaf4f0" stroke="#10b981" stroke-width="3"/>
  <rect x="712" y="206" width="30" height="10" rx="5" fill="#10b981" opacity="0.9"/>

  <!-- Hero image -->
  <rect x="145" y="280" width="640" height="420" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="165" y="300" width="600" height="380" rx="24" fill="#f8fafc"/>
  <circle cx="450" cy="490" r="92" fill="#10b981" opacity="0.20"/>
  <path d="M380 520c30-60 110-80 160-10" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
  <path d="M370 430c60-20 120-10 170 30" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

  <!-- Title & meta -->
  <text x="145" y="770" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="44" font-weight="900" fill="#0b1220">Winter clothing bundle</text>
  <rect x="145" y="804" width="240" height="36" rx="18" fill="#eaf4f0" stroke="#10b981" stroke-width="3"/>
  <text x="265" y="830" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="20" font-weight="900" fill="#0f8a66">Clothing</text>
  <rect x="405" y="804" width="190" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="500" y="830" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="20" font-weight="900" fill="#5b667a">Good</text>

  <!-- Description -->
  <rect x="145" y="875" width="640" height="250" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <text x="180" y="935" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="28" font-weight="900" fill="#0b1220">Description</text>
  <rect x="180" y="970" width="520" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="180" y="1000" width="560" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="180" y="1030" width="480" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="180" y="1060" width="420" height="12" rx="6" fill="#e2e8f0"/>

  <!-- Actions -->
  <rect x="145" y="1160" width="640" height="110" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="180" y="1190" width="300" height="56" rx="22" fill="url(#accent)"/>
  <text x="330" y="1227" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="24" font-weight="900" fill="#ffffff">Add to cart</text>

  <rect x="500" y="1190" width="240" height="56" rx="22" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="620" y="1227" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="24" font-weight="900" fill="#0f8a66">Save</text>

  <!-- Bottom nav -->
  <rect x="115" y="1452" width="670" height="78" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <g fill="#94a3b8" opacity="0.9">
    <rect x="175" y="1476" width="34" height="34" rx="8"/>
    <rect x="315" y="1476" width="34" height="34" rx="8"/>
    <rect x="455" y="1476" width="34" height="34" rx="8"/>
  </g>
  <g fill="#10b981" opacity="0.9">
    <rect x="595" y="1476" width="34" height="34" rx="8"/>
  </g>
  <g fill="#94a3b8" opacity="0.9">
    <rect x="705" y="1476" width="34" height="34" rx="8"/>
  </g>
</svg>

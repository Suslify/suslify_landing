<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Suslify — Donate Items. Connect with Charities. Track Your Impact.</title>
    <meta name="description" content="Suslify is the app that connects donors with charities. Post items to donate, request what you need, message donors directly, and track every donation from listing to pickup." />
    <meta name="keywords" content="donate items, charity app, item donation, donate goods, charitable giving, donate to charity near me, item request app, nonprofit donation tracker" />
    <link rel="canonical" href="https://suslify.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://suslify.netlify.app/" />
    <meta property="og:title" content="Suslify — Donate Items. Connect with Charities." />
    <meta property="og:description" content="Post items to donate, request what you need, message donors directly, and track your impact — all in one free app." />
    <meta property="og:image" content="https://suslify.netlify.app/og-image.png" />
    <meta property="og:site_name" content="Suslify" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Suslify — Give smarter. Waste less." />
    <meta name="twitter:description" content="The free app that connects donors with charities. Post, request, match, and track item donations." />
    <meta name="twitter:image" content="https://suslify.netlify.app/og-image.png" />

    <!-- Indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Suslify" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Suslify",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "iOS, Android",
      "description": "Suslify connects donors with charities. Post items to donate, request what you need, coordinate pickup through in-app messaging, and track every donation from start to finish.",
      "url": "https://suslify.netlify.app/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Suslify",
        "url": "https://suslify.netlify.app/",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "suslifysupport@gmail.com",
          "contactType": "customer support"
        }
      },
      "featureList": [
        "Post item donations with photos and details",
        "Request specific items from donors",
        "In-app messaging to coordinate pickup",
        "Team collection boards for charities",
        "Real-time donation tracking",
        "Charity news and impact feed"
      ]
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Suslify",
      "url": "https://suslify.netlify.app/",
      "logo": "https://suslify.netlify.app/favicon.svg",
      "email": "suslifysupport@gmail.com",
      "description": "Suslify helps people donate the items they no longer need to charities and people who need them.",
      "sameAs": []
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
